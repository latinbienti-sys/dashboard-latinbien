<script>
(function() {
  var MODEL_NAMES = ['HONDA CITY EXL', 'HONDA WR-V EXL'];

  window.__hc = window.__hc || {};
  var REAR_IMAGES = {
    "HONDA CITY EXL": "https://inv360models.s3.amazonaws.com/images/1756507987975-kynwq62zmb.webp",
    "HONDA WR-V EXL": "/img/wrv_trasera.png",
  };

  function initCard(card) {
    if (card._hcInit) return;
    var h3 = card.querySelector('h3');
    if (!h3) return;
    var modelName = h3.textContent.trim();
    if (MODEL_NAMES.indexOf(modelName) === -1) return;
    var img = card.querySelector('img');
    if (!img) return;
    window.__hc[modelName] = img.src;

    var fig = card.querySelector('.hc-figure');
    if (fig) return;
    var parent = img.parentNode;

    var figure = document.createElement('figure');
    figure.className = 'hc-figure';
    img.classList.add('hc-figure-front');
    parent.replaceChild(figure, img);
    figure.appendChild(img);

    var rear = document.createElement('img');
    rear.className = 'hc-figure-rear';
    rear.src = REAR_IMAGES[modelName];
    rear.alt = modelName + ' trasera';
    rear.loading = 'lazy';
    figure.appendChild(rear);

    figure.onmouseenter = function() { img.style.opacity = '0'; rear.style.opacity = '1'; };
    figure.onmouseleave = function() { img.style.opacity = '1'; rear.style.opacity = '0'; };

    card._hcInit = true;
  }

  function initCards() {
    document.querySelectorAll('#modelos .grid > *').forEach(initCard);
  }

  initCards();
  var mo = new MutationObserver(function() { initCards(); });
  var target = document.querySelector('#modelos') || document.body;
  mo.observe(target, { childList: true, subtree: true });
  setTimeout(function() { mo.disconnect(); }, 30000);

  function openCityModal() {
    var m = document.getElementById('hc-modal');
    if (m) m.classList.add('open');
  }

  document.addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) { return; }
    var btnText = btn.textContent.toUpperCase().replace(/\s+/g, '');
    if (btnText.indexOf('VERDETALLES') === -1 && btnText.indexOf('VERDETALLE') === -1) return;
    var card = btn.closest('[class*="shadow-lg"], [class*="rounded-2xl"], article');
    if (!card) return;
    var h3 = card.querySelector('h3');
    if (!h3) return;
    var modelName = h3.textContent.trim().toUpperCase();

    if (modelName.indexOf('WR-V') !== -1) return;

    if (modelName.indexOf('CITY') !== -1) {
      e.stopPropagation();
      e.preventDefault();
      openCityModal();
      return;
    }

    var modelKey = Object.keys(window.__hc || {}).find(function(k) { return modelName.indexOf(k.toUpperCase()) !== -1 || k.toUpperCase().indexOf(modelName) !== -1; });
    if (!modelKey) return;
    e.stopPropagation();
    setTimeout(function() {
      var detailImg = document.querySelector('[class*="md:grid-cols-2"] > div > img, [class*="rounded-2xl"] img');
      if (detailImg) { detailImg.src = window.__hc[modelKey]; }
      setTimeout(function() {
        var simImg = document.querySelector('#simulador img');
        if (simImg) { simImg.src = window.__hc[modelKey]; }
      }, 300);
    }, 100);
  }, true);

  (function initHero() {
    var SLIDES = [
      { img: "/img/wrv_frontal.png", model: "HONDA WR-V EXL", title: "SUV Compacta y Vers\u00e1til", color: "Blanco Perlado" },
      { img: "/img/wrv_frontal.png", model: "HONDA WR-V EXL", title: "Dise\u00f1o Moderno y Seguro", color: "Rojo Ignite" },
      { img: "https://hondavenezuela.com/wp-content/uploads/2026/08/frontal-azul-cosmico-scaled.webp", model: "HONDA CITY EXL", title: "Elegancia y Estilo", color: "Azul C\u00f3smico" }
    ];
    var current = 0, timer;

    function buildHero() {
      var oldEl = document.getElementById('hc-hero');
      if (oldEl) oldEl.parentNode.removeChild(oldEl);

      var hero = document.createElement('div');
      hero.id = 'hc-hero';
      hero.className = 'hc-hero';

      for (var i = 0; i < SLIDES.length; i++) {
        var s = SLIDES[i];
        var slide = document.createElement('div');
        slide.className = 'hc-hero-slide' + (i === 0 ? ' active' : '');
        slide.dataset.index = i;

        var img = document.createElement('img');
        img.src = s.img;
        img.alt = s.model;
        slide.appendChild(img);

        var ol = document.createElement('div');
        ol.className = 'hc-hero-overlay';
        var h2 = document.createElement('h2');
        h2.textContent = s.model;
        ol.appendChild(h2);
        var p = document.createElement('p');
        p.textContent = s.title + ' \u2014 ' + s.color;
        ol.appendChild(p);
        slide.appendChild(ol);

        hero.appendChild(slide);
      }

      var dots = document.createElement('div');
      dots.className = 'hc-hero-dots';
      for (var i = 0; i < SLIDES.length; i++) {
        (function(idx) {
          var btn = document.createElement('button');
          btn.className = 'hc-hero-dot' + (idx === 0 ? ' active' : '');
          btn.onclick = function() { goTo(idx); };
          dots.appendChild(btn);
        })(i);
      }
      hero.appendChild(dots);

      var sim = document.getElementById('simulador') || document.querySelector('[class*="simulador"], [id*="simulador"]');
      if (sim) {
        sim.parentNode.insertBefore(hero, sim.nextSibling);
      } else {
        var sec = document.getElementById('modelos');
        if (sec) {
          sec.parentNode.appendChild(hero);
        } else {
          document.body.appendChild(hero);
        }
      }
    }

    function goTo(idx) {
      var slides = document.querySelectorAll('.hc-hero-slide');
      var dots = document.querySelectorAll('.hc-hero-dot');
      for (var i = 0; i < slides.length; i++) {
        slides[i].className = 'hc-hero-slide' + (i === idx ? ' active' : '');
        dots[i].className = 'hc-hero-dot' + (i === idx ? ' active' : '');
      }
      current = idx;
      clearInterval(timer);
      timer = setInterval(next, 5000);
    }

    function next() { goTo((current + 1) % SLIDES.length); }

    var heroTimer = setInterval(function() {
      var sim = document.getElementById('simulador');
      if (!sim) return;
      clearInterval(heroTimer);
      buildHero();
      var hero = document.getElementById('hc-hero');
      if (hero && sim.parentNode) {
        sim.parentNode.insertBefore(hero, sim.nextSibling);
      }
      timer = setInterval(next, 5000);
    }, 500);
  })();
})();

(function initHeroBg() {
  var idx = 0, timer, txt = [
    { h: 'Tu Nuevo <span class="block text-[#CC0000] mt-2">Honda Te Espera</span>', p: 'Descubre la innovaci\u00f3n japonesa con financiamiento flexible. City EXL y HR-V 2026 en M\u00e9rida.' },
    { h: 'Nuevo <span class="block text-[#CC0000] mt-2">WR-V 2026</span>', p: 'SUV compacta con dise\u00f1o moderno y gran versatilidad para tu d\u00eda a d\u00eda.' }
  ];
  function poll() {
    var imgs = document.querySelectorAll('.hc-bg-img');
    if (imgs.length >= 2) {
      if (timer) clearInterval(timer);
      timer = setInterval(function() {
        for (var i = 0; i < imgs.length; i++) imgs[i].classList.remove('active');
        idx = (idx + 1) % imgs.length;
        imgs[idx].classList.add('active');
        var h1 = document.querySelector('#inicio h1');
        var desc = document.querySelector('#inicio p');
        if (h1) h1.innerHTML = txt[idx].h;
        if (desc) desc.textContent = txt[idx].p;
      }, 5000);
    } else {
      setTimeout(poll, 300);
    }
  }
  poll();
})();
</script>

<script>
(function() {
  var modal = document.getElementById('hc-modal');
  if (modal) {
    modal.querySelector('.hc-modal-close').onclick = function() { modal.classList.remove('open'); };
    modal.onclick = function(e) { if (e.target === modal) modal.classList.remove('open'); };
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') modal.classList.remove('open'); });
    document.getElementById('hc-modal-thumbs').onclick = function(e) {
      var thumb = e.target.closest('img');
      if (!thumb || thumb.dataset.index === undefined) return;
      document.querySelectorAll('#hc-modal-thumbs img').forEach(function(t) { t.className = ''; });
      thumb.className = 'active';
      document.getElementById('hc-modal-main').src = thumb.src;
    };
  }
  var td = document.getElementById('td-modal');
  if (td) {
    td.querySelector('.td-modal-close').onclick = function() { td.classList.remove('open'); };
    td.onclick = function(e) { if (e.target === td) td.classList.remove('open'); };
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') td.classList.remove('open'); });
    document.getElementById('td-form').onsubmit = function(e) {
      e.preventDefault();
      var fd = new FormData(this);
      var data = {
        nombre: fd.get('nombre'),
        telefono: fd.get('telefono'),
        email: fd.get('email') || 'testdrive@hondamerida.com',
        mensaje: 'Test Drive - Modelo: ' + (fd.get('modelo')||'') + ' | Fecha: ' + (fd.get('fecha')||'') + ' | ' + (fd.get('mensaje')||'')
      };
      fetch('/contacto-crm.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      }).then(function(r) { return r.json(); }).then(function(res) {
        if (res.success) {
          td.classList.remove('open');
          alert('Gracias por tu interés. Te contactaremos pronto para confirmar tu test drive.');
        } else {
          alert('Error al enviar: ' + (res.error || 'desconocido'));
        }
      }).catch(function() {
        alert('Error de conexión. Intenta de nuevo.');
      });
    };
  }
})();
</script>

<script>
(function() {
  var LOGO = "https://hondavenezuela.com/wp-content/uploads/2026/08/LOGO-HONDA-VERTICAL@3x.webp";
  var PROMOS = [
    {
      model: "HONDA WR-V EXL",
      phrase: [["TU PR\u00d3XIMA AVENTURA",0],["EMPIEZA HOY",1]],
      img: "/img/wrv_frontal.png",
      cta: "testdrive"
    },
    {
      model: "HONDA CITY EXL",
      phrase: [["ELEGANCIA QUE",0],["SE SIENTE AL MANEJAR",1]],
      img: "https://hondavenezuela.com/wp-content/uploads/2026/08/frontal-azul-cosmico-scaled.webp",
      cta: "testdrive"
    },
    {
      model: "HONDA HR-V",
      phrase: [["DISE\u00d1O AUDAZ,",0],["MANEJO PERFECTO",1]],
      img: "https://hondavenezuela.com/wp-content/uploads/2026/08/frontal-gris-basalto.webp",
      cta: "testdrive"
    },
    {
      model: "HONDA",
      phrase: [["TU HONDA TE ESPERA,",0],["TU FINANCIAMIENTO TAMBI\u00c9N",1]],
      img: "https://hondavenezuela.com/wp-content/uploads/2026/08/frontal-blanco-perlado.webp",
      cta: "financiamiento"
    },
    {
      model: "HONDAMERIDA",
      phrase: [["M\u00c9RIDA CONF\u00cdA EN",0],["HONDAMERIDA",1]],
      img: "https://hondavenezuela.com/wp-content/uploads/2026/08/frontal-rojo-supernova_70-scaled.webp",
      cta: "contacto"
    }
  ];

  var CTA_LABELS = {
    testdrive: "AGENDA TU TEST DRIVE",
    financiamiento: "COTIZA TU FINANCIAMIENTO",
    contacto: "CONOCE HONDAMERIDA"
  };

  function openTarget(kind) {
    if (kind === 'financiamiento') {
      var sim = document.getElementById('simulador');
      if (sim) { sim.scrollIntoView({ behavior:'smooth' }); return; }
    }
    if (kind === 'contacto') {
      var contacto = document.querySelector('#contacto, section[id*="ontact"], [class*="ontact"]');
      if (contacto) { contacto.scrollIntoView({ behavior:'smooth' }); return; }
    }
    var modal = document.getElementById('td-modal');
    if (modal) modal.classList.add('open');
    else {
      var modelos = document.getElementById('modelos');
      if (modelos) modelos.scrollIntoView({ behavior:'smooth' });
    }
  }

  function build() {
    if (document.getElementById('hc-promociones')) return;
    var inicio = document.getElementById('inicio');
    var modelos = document.getElementById('modelos');
    if (!inicio && !modelos) return;

    var sec = document.createElement('section');
    sec.id = 'hc-promociones';
    sec.className = 'hc-promo';

    var head = document.createElement('div');
    head.className = 'hc-promo-head';
    head.innerHTML = '<h2>Novedades</h2>';
    sec.appendChild(head);

    var wrap = document.createElement('div');
    wrap.className = 'hc-promo-wrap';

    var prev = document.createElement('button');
    prev.className = 'hc-promo-nav prev'; prev.type='button'; prev.setAttribute('aria-label','Anterior'); prev.textContent = '\u2039';
    var next = document.createElement('button');
    next.className = 'hc-promo-nav next'; next.type='button'; next.setAttribute('aria-label','Siguiente'); next.textContent = '\u203a';

    var track = document.createElement('div');
    track.className = 'hc-promo-track';

    for (var i=0;i<PROMOS.length;i++) {
      var p = PROMOS[i];
      var card = document.createElement('article');
      card.className = 'hc-promo-card';
      card.dataset.model = p.model;

      var top = document.createElement('div');
      top.className = 'hc-promo-top';
      var line = document.createElement('div');
      line.className='hc-promo-line';
      var phrase = document.createElement('div');
      phrase.className='hc-promo-phrase';
      var phraseHtml='';
      for(var j=0;j<p.phrase.length;j++){
        phraseHtml += '<div'+(p.phrase[j][1]===1?' class="red"':'')+'>'+p.phrase[j][0]+'</div>';
      }
      phrase.innerHTML=phraseHtml;
      top.appendChild(line); top.appendChild(phrase);
      card.appendChild(top);

      var pos = document.createElement('div');
      pos.className='hc-promo-pos';
      pos.textContent = (i+1)+'/'+PROMOS.length;
      card.appendChild(pos);

      var media = document.createElement('div');
      media.className='hc-promo-media';
      var img = document.createElement('img');
      img.src=p.img; img.alt=p.model; img.loading='lazy';
      media.appendChild(img);
      card.appendChild(media);

      var foot = document.createElement('div');
      foot.className='hc-promo-foot';
      var tag = document.createElement('div');
      tag.className='hc-promo-tag';
      tag.textContent = CTA_LABELS[p.cta] || 'Ver m\u00e1s';
      var cta = document.createElement('div');
      cta.className='hc-promo-cta'; cta.textContent='\u2192';
      foot.appendChild(tag); foot.appendChild(cta);
      card.appendChild(foot);

      (function(kind){ card.addEventListener('click', function(){ openTarget(kind); }); })(p.cta);

      track.appendChild(card);
    }

    wrap.appendChild(prev); wrap.appendChild(next); wrap.appendChild(track);
    sec.appendChild(wrap);

    // insertar justo después del hero (inicio), en flujo normal, como bloque independiente
    if (inicio) {
      inicio.insertAdjacentElement('afterend', sec);
    } else if (modelos) {
      modelos.insertAdjacentElement('beforebegin', sec);
    } else {
      return;
    }

    // indicador de posición actual (resaltar chip oculto no aplica aquí ya que cada tarjeta lleva su propio chip)
    var scrolled = false;
    prev.addEventListener('click', function(e){ e.stopPropagation(); track.scrollBy({left:-364,behavior:'smooth'}); });
    next.addEventListener('click', function(e){ e.stopPropagation(); track.scrollBy({left:364,behavior:'smooth'}); });

    // autoscroll: avanza solo, pausa al pasar el cursor y al interactuar
    var autoTimer = null;
    function autoSlide() {
      var max = track.scrollWidth - track.clientWidth;
      if (max <= 0) return;
      if (track.scrollLeft >= max - 4) track.scrollTo({left:0, behavior:'smooth'});
      else track.scrollBy({left:364, behavior:'smooth'});
    }
    function startAuto() {
      if (!autoTimer) autoTimer = setInterval(autoSlide, 2000);
    }
    function stopAuto() {
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    }
    startAuto();
    sec.addEventListener('mouseenter', stopAuto);
    sec.addEventListener('mouseleave', startAuto);
    track.addEventListener('touchstart', stopAuto, {passive:true});
    prev.addEventListener('click', stopAuto); next.addEventListener('click', stopAuto);

    // swipe táctil en desktop track también por si acaso (native scroll-snap ya maneja # sobre móvil)
  }

  var tries=0;
  var t=setInterval(function(){
    tries++;
    build();
    if (document.getElementById('hc-promociones') || tries>120) clearInterval(t);
  }, 500);
})();
</script>
