name: Actualizar Dashboard

on:
  schedule:
    # Cada 3 horas (minuto 0)
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Generar dashboard desde Odoo
        env:
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_PASS: ${{ secrets.ODOO_PASS }}
        run: |
          python server.py --generate

      - name: Enviar recordatorios de pago a proveedor
        env:
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_PASS: ${{ secrets.ODOO_PASS }}
          LATINBIEN_SMTP_USER: ${{ secrets.LATINBIEN_SMTP_USER }}
          LATINBIEN_SMTP_PASS: ${{ secrets.LATINBIEN_SMTP_PASS }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          from server import fetch_data
          from email_proveedor import verificar_pagos_proximos, enviar_correo_recordatorio
          print('Verificando pagos próximos al proveedor...')
          try:
              data = fetch_data()
              pagos = verificar_pagos_proximos(data)
              if pagos:
                  for p in pagos:
                      ok, msg = enviar_correo_recordatorio(
                          proveedor=p['proveedor'],
                          orden_compra=p['orden_compra'],
                          cliente=p['cliente'],
                          modelo=p['modelo'],
                          cuota_num=p['cuota_num'],
                          total_cuotas=p['total_cuotas'],
                          monto=p['monto'],
                          fecha_pago=p['fecha_pago'],
                          ciclo=p['ciclo'],
                          opcion=p['opcion']
                      )
                      print(f'  Cuota {p[\"cuota_num\"]}: {msg}')
              else:
                  print('  No hay pagos próximos pendientes.')
          except Exception as e:
              print(f'  Error enviando recordatorios: {e}')
          "

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit y push
        run: |
          git add index.html
          if git diff --cached --quiet; then
            echo "No hay cambios en index.html"
          else
            git commit -m "Dashboard actualizado $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
