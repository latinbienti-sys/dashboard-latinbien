name: Actualizar Dashboard

on:
  schedule:
    # Cada 3 horas (minuto 0)
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Generar dashboard desde Odoo
        env:
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_PASS: ${{ secrets.ODOO_PASS }}
        run: |
          python server.py --generate

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit y push
        run: |
          git add index.html
          if git diff --cached --quiet; then
            echo "No hay cambios en index.html"
          else
            git commit -m "Dashboard actualizado $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/latinbienti-sys/profesional.git HEAD:main
          fi