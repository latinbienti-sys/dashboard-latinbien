name: Actualizar Dashboard

on:
  schedule:
    # Cada 3 horas (minuto 0)
    - cron: '0 */3 * * *'
  workflow_dispatch:  # También se puede ejecutar manualmente desde GitHub

permissions:
  contents: write  # Necesario para hacer commit y push del index.html generado

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Generar dashboard desde Odoo
        env:
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_PASS: ${{ secrets.ODOO_PASS }}
        run: |
          python server.py --generate

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No hay cambios en index.html, omitiendo commit"
          else
            git commit -m "Dashboard actualizado $(date -u '+%Y-%m-%d %H:00 UTC')"
            git push
          fi