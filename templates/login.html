<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso · Balance Grupo de Empresas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; min-height: 100vh; display: flex; align-items: center; }
        .card { box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.08); border: none; max-width: 380px; width: 100%; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center px-3">
    <div class="card">
        <div class="card-header bg-dark text-white text-center py-3">
            <i class="bi bi-calculator"></i> Balance Grupo de Empresas
        </div>
        <div class="card-body p-4">
            {% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}
            <form method="post" autocomplete="off">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input name="usuario" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Clave</label>
                    <input name="clave" type="password" class="form-control" required>
                </div>
                <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
